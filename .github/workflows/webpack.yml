name: NodeJS with Webpack

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: 'npm'

    - name: Build
      run: |
        npm install --legacy-peer-deps
        npm build
